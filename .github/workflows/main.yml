name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Extract Project Files
        run: |
          python3 -c "import base64, io, os, zipfile; data = base64.b64decode(''); z = zipfile.ZipFile(io.BytesIO(data)); [os.makedirs(os.path.dirname(os.path.join('.', m.filename[17:])), exist_ok=True) or open(os.path.join('.', m.filename[17:]), 'wb').write(z.read(m)) for m in z.infolist() if m.filename.startswith('GlitterSandSlate/') and not m.is_dir()]; print('Files extracted successfully')"

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlitterSandSlate-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
